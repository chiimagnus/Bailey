name: Bug report
description: Report something that isn't working in Bailey
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        中文优先，英文也可以。Chinese preferred; English is welcome.
        安全漏洞请按 [SECURITY.md](https://github.com/chiimagnus/Bailey/blob/main/SECURITY.md) 私下报告；截图与日志请移除密钥、私人路径和终端内容。

  - type: checkboxes
    id: existing-search
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and didn't find this already reported
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        What you did, what you expected, and what happened instead.
        只需补充图片无法呈现的前因或结果。
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: 可直接上传截图或短录屏；静态问题优先截图，交互问题使用录屏。不要将排障截图提交到 Git 仓库。
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Bailey version or commit
      placeholder: 0.1.48 or abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: macOS + Mac model + project connection
      placeholder: macOS 15.6 · Apple Silicon Mac · local project / SSH (host OS and shell)
    validations:
      required: true
