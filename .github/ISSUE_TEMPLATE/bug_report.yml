name: Bug report
description: Report something that isn't working in Bailey
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        中文优先，英文也可以。Chinese preferred; English is welcome.
        安全漏洞请按 [SECURITY.md](https://github.com/chiimagnus/Bailey/blob/main/SECURITY.md) 私下报告；截图与日志请移除密钥、私人路径和终端内容。

  - type: checkboxes
    id: existing-search
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and didn't find this already reported
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        What you did, what you expected, and what happened instead.
        A short recording beats a paragraph.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drag and drop images or a recording here. Optional but speeds up triage.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Bailey version or commit
      placeholder: X.Y.Z or abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: macOS + Mac model + project connection
      placeholder: macOS 15.6 · Apple Silicon Mac · local project / SSH (host OS and shell)
    validations:
      required: true
