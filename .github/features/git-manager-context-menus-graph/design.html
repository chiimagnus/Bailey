<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Kero · Recent Commits · Git Graph 参考设计 V4</title>
<style>
:root {
  color-scheme: dark;
  --surface:#0c0e13;
  --background:#090b10;
  --text:#e4e5ea;
  --secondary:#90949e;
  --subtle:#797d87;
  --separator:#262930;
  --accent:#56b9f1;
  --trunk:#6985f4;
  --hover:#171c24;
  --selection:#1c2736;
  --row-height:57px;
  --graph-gutter:68px;
}
* {box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--background);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC",sans-serif;font-size:12px;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:default}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{max-width:706px;padding:14px 12px 22px;margin:0 auto}
.component{background:var(--surface);border:1px solid #252830;border-radius:9px;overflow:hidden}
.section-header{display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;width:100%;border:0;background:transparent;color:#8c909c;text-align:left}
.section-header:hover{color:#c6cad2}
.chevron{flex:none;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;transition:transform .15s}
.section-header[aria-expanded=false] .chevron{transform:rotate(-90deg)}
.section-title{font-size:12px;font-weight:650;letter-spacing:.012em}
.count{margin-left:auto;background:#20232b;border-radius:13px;min-width:32px;text-align:center;padding:3px 9px;color:#90939d;font-size:11px;font-variant-numeric:tabular-nums}
.commit-list{max-height:1000px;overflow-y:auto;overflow-x:hidden;padding:0 7px 12px 4px;scrollbar-width:thin;scrollbar-color:#39414e transparent}
.commit-list::-webkit-scrollbar{width:6px}.commit-list::-webkit-scrollbar-thumb{background:#39414e;border-radius:7px}
.commit-track{position:relative}
.commit-entry{position:relative;isolation:isolate;min-height:var(--row-height)}
.commit-row{display:flex;align-items:stretch;position:relative;z-index:1;min-height:var(--row-height);border-radius:3px}
.commit-entry:hover>.commit-row{background:var(--hover)}
.commit-entry.expanded>.commit-row{background:var(--selection)}
.rail-slot{flex:0 0 var(--graph-gutter);pointer-events:none}
.commit-content{min-width:0;flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:7px 5px 8px 0}
.commit-content:after{content:"";position:absolute;bottom:0;left:0;right:0;border-bottom:1px solid var(--separator)}
.title-line{display:flex;align-items:center;gap:9px;min-height:21px;min-width:0;white-space:nowrap}
.subject-trigger{flex:0 1 auto;min-width:62px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:none;border:0;padding:0;color:#e7e8ec;font-size:13.9px;font-weight:450;line-height:21px;text-align:left}
.subject-trigger:hover{color:#fff}
.ref-list{min-width:0;display:flex;align-items:center;gap:5px;flex:0 1 auto}
.ref{display:inline-flex;align-items:center;justify-content:center;max-width:165px;min-width:0;height:20px;padding:0 9px;border-radius:13px;border:0;background:#6d7fd6;color:#f4f6ff;white-space:nowrap;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.ref .label{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ref:where(button):hover{filter:brightness(1.15)}
.ref.current{background:#58b5ef;color:#fff}
.ref.local,.ref.tracking{background:#6e80d7;color:#eff2ff}
.ref.tag{background:#685c3f;color:#ffe1a2}
.ref.tag .tag-mark{font-size:12px;margin-right:3px}
.ref.tracking{cursor:default}
.ref-overflow{flex:none;color:#9499a5;font-size:10.5px}
.meta-line{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap;line-height:18px}
.sha{background:none;border:0;padding:0;color:#9195a0;font-size:11.9px;letter-spacing:.85px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.sha:hover{color:#ccd6ed}
.author{font-family:"Snell Roundhand","Apple Chancery",Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:12.3px;color:#8e929d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{margin-left:auto;font-variant-numeric:tabular-nums;flex:none;color:#898d99;font-size:11.8px;letter-spacing:.005em}
.graph-svg{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible}
.graph-svg path{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round}
.graph-svg circle{stroke:var(--surface);stroke-width:1.7}
.commit-files{position:relative;z-index:1;padding:3px 0 7px}
.file{width:100%;height:27px;display:flex;align-items:center;gap:7px;padding-right:8px;border:0;background:none;color:#a5abb8;border-radius:3px;text-align:left}
.file:hover{background:#1e2531;color:#fff}
.file svg{width:15px;height:15px;flex:none;color:#63b7f2}
.file-path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.file-status{margin-left:auto;color:#55c780;font-size:11px;font-weight:600}
.file-status.deleted{color:#ee777e}
.note{color:#7d8290;font-size:11px;line-height:1.7;margin:12px 3px 0;text-align:center}
.note kbd{color:#b2b8c6;background:#1d242f;border:1px solid #343c4a;border-radius:3px;padding:1px 4px;font:inherit}
/* This HTML-only context menu is a prototype. The actual Kero implementation uses SwiftUI .contextMenu. */
.context-menu{position:fixed;z-index:2000;max-width:min(350px,calc(100vw - 16px));min-width:238px;padding:5px;background:rgba(40,41,48,.97);border:1px solid #565963;border-radius:9px;color:#e9eaef;box-shadow:0 16px 45px rgba(0,0,0,.75);backdrop-filter:blur(18px)}
.context-menu[hidden],.dialog-overlay[hidden],.toast[hidden]{display:none}
.menu-title{color:#a4a8b2;font-size:10px;padding:6px 9px 7px;border-bottom:1px solid #535660;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-button{display:block;width:100%;height:30px;border:0;border-radius:5px;background:none;text-align:left;color:inherit;font-size:12px;padding:0 10px}
.menu-button:hover,.menu-button:focus-visible{background:#377ed1;color:#fff;outline:0}
.menu-rule{height:1px;background:#51535a;margin:5px 3px}
.dialog-overlay{position:fixed;inset:0;z-index:2100;background:#000a;display:flex;align-items:center;justify-content:center;padding:15px}
.dialog{background:#242831;color:#e9edf3;border:1px solid #495262;box-shadow:0 24px 60px #000b;border-radius:12px;width:min(390px,100%);padding:20px}
.dialog h2{font-size:16px;font-weight:600;margin:0 0 10px}
.dialog p{font-size:12px;line-height:1.7;margin:0 0 13px;color:#aeb4c0}
.dialog code{color:#74c5fb}
.dialog input{width:100%;height:34px;padding:0 10px;background:#111620;color:#eef2f8;border:1px solid #4c5667;border-radius:6px;outline:0}
.dialog input:focus{border-color:#5ab8f2}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dialog-actions button{background:#353b48;color:#edf2f9;border:1px solid #4a5466;border-radius:6px;padding:7px 12px}
.dialog-actions .primary{background:#3292cf;border-color:#3292cf;color:white}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:2400;padding:10px 14px;border-radius:7px;border:1px solid #405674;background:#253449;color:#edf6ff;max-width:calc(100vw - 28px);font-size:11.5px;box-shadow:0 12px 36px #000a;text-align:center}
@media(max-width:550px){main{padding:8px 3px 20px}.component{border-radius:5px}.section-header{height:35px}.commit-list{padding:0 3px 10px 2px;max-height:calc(100dvh - 105px)}.subject-trigger{font-size:12.6px;min-width:37px}.ref{max-width:107px;font-size:10.8px;height:19px;padding:0 7px}.ref-list{gap:3px}.meta-line{gap:7px}.sha{font-size:10.5px;letter-spacing:.2px}.author{font-size:11.4px}.time{font-size:10.6px}.commit-content{gap:4px}.rail-slot{flex-basis:60px}}
@media(max-width:365px){.author{max-width:74px}.ref{max-width:81px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <section class="component" aria-label="Kero Recent Commits 组件设计">
    <button id="history-header" class="section-header" type="button" aria-expanded="true" aria-controls="commit-list">
      <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
      <span class="section-title">RECENT COMMITS</span>
      <span class="count" id="history-count" title="仓库计数示例（可见列表仅为模拟数据）">90</span>
    </button>
    <div id="commit-list" class="commit-list" role="list" aria-label="Recent Commits"></div>
  </section>
  <p class="note">参考 <a href="https://github.com/chiimagnus/kero/issues/2" target="_blank" rel="noopener noreferrer" style="color:#8faad1">Issue #2</a> 中的 Git Graph 截图 · 点击标题展开文件 · <kbd>右键</kbd> Commit / Branch / Tag 打开对应菜单<br>数据与操作均为设计演示，不会运行 Git</p>
</main>
<div class="context-menu" id="context-menu" role="menu" hidden></div>
<div class="dialog-overlay" id="dialog-overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title">创建引用</h2>
    <p id="dialog-description"></p>
    <input id="dialog-name" aria-label="引用名称" autocomplete="off" spellcheck="false" placeholder="名称">
    <div class="dialog-actions"><button id="dialog-cancel" type="button">取消</button><button id="dialog-create" type="button" class="primary">在预览中创建</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const list=$('#commit-list'),menu=$('#context-menu'),dialog=$('#dialog-overlay');
const escapes={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const safe=s=>String(s).replace(/[&<>"']/g,c=>escapes[c]);
const key=n=>((((Math.imul(n,0x9e3779b9)^0x56788abc)>>>0).toString(16).padStart(8,'0'))+'1b9d53ae48f0d6c7129af426ad99f7be').slice(0,40);
const ref=(type,name)=>({type,name});
const file=(path,status='M')=>({path,status});
const data=[
  {n:100,subject:'修复 Git Manager 外部变更后的刷新延迟',parents:[101],age:'3 days ago',refs:[ref('tracking','origin/fix/git-refresh-long-name'),ref('local','fix/git-refresh-long-name')],files:[file('kero/Git/GitStatusModel.swift')]},
  {n:101,subject:'Merge pull request #12 from chiimagnus/feat/git-graph',parents:[108,102],age:'3 days ago',refs:[ref('current','main')],files:[file('kero/Git/RecentCommitsView.swift'),file('KeroTests/GitStatusModelTests.swift')]},
  {n:102,subject:'完善 Recent Commits 的 Ref 分类与菜单',parents:[103],age:'3 days ago',refs:[ref('tracking','origin/feat/git-graph-context'),ref('local','feat/git-graph-context')],files:[file('kero/Git/RecentCommitsView.swift')]},
  {n:103,subject:'支持 Recent Commits 真实分叉与合并',parents:[104],age:'3 days ago',files:[file('kero/Git/RecentCommitsView.swift'),file('kero/Git/GitStatusModel.swift')]},
  {n:104,subject:'将所有父提交关系用于拓扑布局',parents:[105],age:'3 days ago',files:[file('kero/Git/GitStatusModel.swift')]},
  {n:105,subject:'保留提交引用的完整类型与名称',parents:[106],age:'3 days ago',files:[file('kero/Git/GitStatusModel.swift')]},
  {n:106,subject:'修复 Git 历史展开时的车道位置',parents:[107],age:'3 days ago',files:[file('kero/Git/RecentCommitsView.swift')]},
  {n:107,subject:'统一提交标题与历史文件行的布局',parents:[108],age:'4 days ago',files:[file('kero/Git/RecentCommitsView.swift')]},
  {n:108,subject:'Merge pull request #11 from chiimagnus/feat/ssh-status',parents:[110,109],age:'1 wk ago',refs:[ref('tracking','origin/main')],files:[file('kero/Git/GitPanel.swift')]},
  {n:109,subject:'SSH 项目的 Git 状态与本地保持一致',parents:[110],age:'1 wk ago',files:[file('kero/Workspace/SSHHostWorkspaces.swift')]},
  {n:110,subject:'Merge pull request #10 from chiimagnus/feat/native-menus',parents:[112,111],age:'1 wk ago',files:[file('kero/Git/GitPanel.swift')]},
  {n:111,subject:'完善 Git Context Menu 的对象归属',parents:[112],age:'1 wk ago',files:[file('kero/Git/GitPanel.swift')]},
  {n:112,subject:'Merge pull request #9 from chiimagnus/fix/changes',parents:[115,113],age:'1 wk ago',files:[file('kero/Git/GitStatusModel.swift')]},
  {n:113,subject:'精简 Changes 文件列表与操作提示',parents:[114],age:'1 wk ago',refs:[ref('tracking','origin/fix/changes-lifecycle')],files:[file('kero/Git/GitPanel.swift')]},
  {n:114,subject:'修复暂存文件与历史文件菜单差异',parents:[115],age:'1 wk ago',files:[file('kero/Git/GitPanel.swift')]},
  {n:115,subject:'统一 Files / Git 的共享树组件',parents:[116],age:'2 wk ago',refs:[ref('tag','v0.1.48')],files:[file('kero/Shared/Tree/TreeDisplayModel.swift')]},
  {n:116,subject:'引入原生 macOS Git Manager',parents:[],age:'2 wk ago',files:[file('kero/Git/GitPanel.swift','A')]}
].map(x=>({...x,id:key(x.n),parents:x.parents.map(key),refs:x.refs||[],author:'Chii Magnus'}));
const byId=new Map(data.map(x=>[x.id,x]));
const PALETTE=['#65c274','#bd60d0','#5dbad7','#e9d55c','#df6b70'];
const mainColor='#6985f4',ROW=57;
const state={expanded:new Set(),created:new Map(),collapsed:false,context:null,action:null,toastTimer:null};
const refsFor=row=>[...row.refs,...(state.created.get(row.id)||[])];
function topo(){
  // The branch carrying local main defines the trunk, following only real first parents.
  const main=data.find(x=>x.refs.some(r=>r.type==='current'&&r.name==='main'));
  const map=new Map();let ptr=main;
  while(ptr&&!map.has(ptr.id)){
    map.set(ptr.id,{lane:0,color:mainColor,kind:'main'});
    ptr=byId.get(ptr.parents[0]);
  }
  let branchNumber=0;
  // Assign each separate first-parent side history one distinct color; reuse its lane when not overlapping.
  for(const commit of data){
    if(map.has(commit.id))continue;
    const color=PALETTE[branchNumber++%PALETTE.length];
    let walk=commit;
    while(walk&&!map.has(walk.id)){
      map.set(walk.id,{lane:1,color,kind:'side'});
      walk=byId.get(walk.parents[0]);
    }
  }
  return map;
}
const topology=topo();
const tagGraphic='<svg aria-hidden="true" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M1.5 1.5h4L10.5 6 6 10.5 1.5 6z"/><circle cx="4.3" cy="4.1" r=".7"/></svg>';
const fileGraphic='<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3"/></svg>';
function badge(x,row){
  const label=safe(x.name);
  const attributes=`data-ref-type="${safe(x.type)}" data-ref-name="${label}" data-id="${row.id}" title="${label}"`;
  const inner=`${x.type==='tag'?`<span class="tag-mark">◇</span>`:''}<span class="label">${label}</span>`;
  return x.type==='tracking'?`<span class="ref tracking" ${attributes}>${inner}</span>`:`<button type="button" class="ref ${safe(x.type)}" ${attributes} aria-label="${label}，右键显示菜单">${inner}</button>`;
}
function visibleRefs(row){
  const refs=refsFor(row),limit=innerWidth<550?1:2;
  return {shown:refs.slice(0,limit),extra:Math.max(0,refs.length-limit)};
}
function drawGraph(){
  const track=$('#commit-track'),svg=$('#graph-svg');if(!track||!svg)return;
  const cells=new Map([...track.querySelectorAll('.commit-entry')].map(x=>[x.dataset.id,x]));
  const offset=id=>cells.get(id)?.offsetTop+ROW/2;
  const x=lane=>lane===0?18:46;
  const paths=[],nodes=[];
  for(const row of data){
    const current=topology.get(row.id),fromY=offset(row.id);
    for(const parentId of row.parents){
      if(!cells.has(parentId))continue;
      const next=topology.get(parentId),toY=offset(parentId),x1=x(current.lane),x2=x(next.lane);
      const color=current.lane===0&&next.lane!==0?next.color:current.color;
      let d;
      if(x1===x2)d=`M${x1} ${fromY}L${x2} ${toY}`;
      else if(x1<x2){const span=Math.min(23,(toY-fromY)*.44);d=`M${x1} ${fromY}C${x1} ${fromY+span*.9},${x2} ${fromY+span*.8},${x2} ${fromY+span}L${x2} ${toY}`;}
      else{const span=Math.min(23,(toY-fromY)*.44);d=`M${x1} ${fromY}L${x1} ${toY-span}C${x1} ${toY-span*.7},${x2} ${toY-span*.85},${x2} ${toY}`;}
      paths.push(`<path data-from="${row.id}" data-to="${parentId}" stroke="${color}" d="${d}"/>`);
    }
  }
  for(const row of data){const t=topology.get(row.id);nodes.push(`<circle data-node="${row.id}" cx="${x(t.lane)}" cy="${offset(row.id)}" r="5.5" fill="${t.color}"/>`);}
  svg.setAttribute('viewBox',`0 0 68 ${track.offsetHeight}`);svg.setAttribute('width','68');svg.setAttribute('height',String(track.offsetHeight));svg.innerHTML=paths.join('')+nodes.join('');
}
function hideMenu(){menu.hidden=true;menu.innerHTML='';state.context=null;}
function render(){
  hideMenu();const fragment=data.map(row=>{
    const expanded=state.expanded.has(row.id),{shown,extra}=visibleRefs(row);
    const refsHTML=shown.length?`<span class="ref-list">${shown.map(r=>badge(r,row)).join('')}${extra?`<span class="ref-overflow" title="另外 ${extra} 个引用">+${extra}</span>`:''}</span>`:'';
    const files=expanded?`<div class="commit-files">${row.files.map(f=>`<button type="button" class="file" data-commit-id="${row.id}" data-path="${safe(f.path)}" style="padding-left:var(--graph-gutter)" title="右键查看历史文件菜单"><span>${fileGraphic}</span><span class="file-path">${safe(f.path)}</span><span class="file-status ${f.status==='D'?'deleted':''}">${safe(f.status)}</span></button>`).join('')}</div>`:'';
    return `<article class="commit-entry ${expanded?'expanded':''}" role="listitem" data-id="${row.id}" data-lane="${topology.get(row.id).lane}" data-parents="${row.parents.length}">
    <div class="commit-row" data-commit-id="${row.id}">
      <span class="rail-slot" aria-hidden="true"></span>
      <div class="commit-content">
        <div class="title-line"><button type="button" class="subject-trigger" data-commit-id="${row.id}" aria-expanded="${expanded}" title="${safe(row.subject)}">${safe(row.subject)}</button>${refsHTML}</div>
        <div class="meta-line"><button type="button" class="sha" data-commit-id="${row.id}" title="点击复制完整 SHA：${row.id}">${row.id.slice(0,8)}</button><span class="author">${safe(row.author)}</span><time class="time">${safe(row.age)}</time></div>
      </div>
    </div>${files}</article>`;
  }).join('');
  list.innerHTML=`<div class="commit-track" id="commit-track">${fragment}<svg class="graph-svg" id="graph-svg" aria-hidden="true"></svg></div>`;
  list.hidden=state.collapsed;$('#history-header').setAttribute('aria-expanded',String(!state.collapsed));
  drawGraph();
}
function toast(s){let el=$('#toast');el.textContent=s;el.hidden=false;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.hidden=true,2900);}
function toggle(id){const scroll=list.scrollTop;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render();list.scrollTop=scroll;list.querySelector(`[data-id="${id}"] .subject-trigger`)?.focus({preventScroll:true});}
const separator={sep:true};
function items(type,ctx){
  if(type==='commit')return [{text:state.expanded.has(ctx.row.id)?'收起此提交的文件':'展开此提交的文件',action:'toggle'},separator,{text:'在此创建本地分支…',action:'branch'},{text:'在此创建 Tag…',action:'tag'},separator,{text:'复制 Commit SHA',action:'sha'},{text:'复制 Commit 标题',action:'subject'}];
  if(type==='current')return [{text:'复制当前分支名称',action:'ref'}];
  if(type==='local')return [{text:'切换到此本地分支',action:'switch'},separator,{text:'复制分支名称',action:'ref'}];
  if(type==='tag')return [{text:'定位此 Tag 指向的 Commit',action:'locate'},separator,{text:'复制 Tag 名称',action:'ref'}];
  if(type==='history-file')return [{text:'查看该提交中的文件差异',action:'diff'},separator,{text:'复制相对路径',action:'path'}];
  return [];
}
function openMenu(type,ctx,x,y){
  hideMenu();const choices=items(type,ctx);if(!choices.length)return;
  state.context={type,ctx,choices};const title=type==='commit'?`Commit · ${ctx.row.id.slice(0,8)}`:type==='history-file'?ctx.path:`${type==='tag'?'Tag':'Branch'} · ${ctx.name}`;
  menu.innerHTML=`<div class="menu-title">${safe(title)}</div>`+choices.map((o,i)=>o.sep?'<div class="menu-rule" role="separator"></div>':`<button type="button" class="menu-button" data-choice="${i}" role="menuitem">${safe(o.text)}</button>`).join('');
  menu.hidden=false;
  menu.style.left='0';menu.style.top='0';const rect=menu.getBoundingClientRect();
  menu.style.left=Math.max(6,Math.min(x,innerWidth-rect.width-7))+'px';
  menu.style.top=Math.max(6,Math.min(y,innerHeight-rect.height-7))+'px';
  menu.querySelector('.menu-button')?.focus({preventScroll:true});
}
async function copy(text){try{if(!navigator.clipboard?.writeText)throw Error('no clipboard');await navigator.clipboard.writeText(text);toast('已复制：'+text.slice(0,32));}catch{toast('复制内容：'+text.slice(0,32));}}
function openDialog(type,row){state.action={type,row};$('#dialog-title').textContent=type==='branch'?'从此提交创建本地分支':'从此提交创建 Tag';$('#dialog-description').innerHTML=`目标 Commit：<code>${row.id.slice(0,12)}</code><br>仅变更演示内容，不执行 Git。`;$('#dialog-name').value='';$('#dialog-name').placeholder=type==='tag'?'v0.2.0':'feature/name';dialog.hidden=false;$('#dialog-name').focus();}
function closeDialog(){dialog.hidden=true;state.action=null;}
function act(cmd){
  const held=state.context;if(!held)return;const {ctx}=held;hideMenu();const row=ctx.row;
  switch(cmd){
    case 'toggle':toggle(row.id);break;
    case 'branch':case 'tag':openDialog(cmd,row);break;
    case 'sha':copy(row.id);break;
    case 'subject':copy(row.subject);break;
    case 'ref':copy(ctx.name);break;
    case 'switch':toast(`预览：切换到 ${ctx.name}（未执行 Git）`);break;
    case 'locate':state.expanded.add(row.id);render();list.querySelector(`[data-id="${row.id}"]`)?.scrollIntoView({block:'nearest'});toast(`Tag ${ctx.name} → ${row.id.slice(0,8)}`);break;
    case 'diff':toast(`预览历史 Diff：${ctx.path}`);break;
    case 'path':copy(ctx.path);break;
  }
}
$('#history-header').addEventListener('click',()=>{state.collapsed=!state.collapsed;render();});
list.addEventListener('click',e=>{
  const badge=e.target.closest('.ref');if(badge){if(badge.dataset.refType!=='tracking')toast(`引用：${badge.dataset.refName}，右键查看菜单`);return;}
  const f=e.target.closest('.file');if(f){toast('双击可查看此提交的文件差异（演示）');return;}
  const sha=e.target.closest('.sha');if(sha){copy(byId.get(sha.dataset.commitId).id);return;}
  const commit=e.target.closest('.subject-trigger');if(commit)toggle(commit.dataset.commitId);
});
list.addEventListener('dblclick',e=>{const f=e.target.closest('.file');if(f)toast('预览历史 Diff：'+f.dataset.path);});
function maybeContext(target,x,y){
  const f=target.closest('.file');if(f){openMenu('history-file',{row:byId.get(f.dataset.commitId),path:f.dataset.path},x,y);return true;}
  const badge=target.closest('[data-ref-type]');if(badge){if(badge.dataset.refType==='tracking'){hideMenu();toast('远端跟踪引用仅展示，不另设管理菜单');return true;}openMenu(badge.dataset.refType,{row:byId.get(badge.dataset.id),name:badge.dataset.refName},x,y);return true;}
  const r=target.closest('.commit-row');if(r){openMenu('commit',{row:byId.get(r.dataset.commitId)},x,y);return true;}return false;
}
list.addEventListener('contextmenu',e=>{if(maybeContext(e.target,e.clientX,e.clientY))e.preventDefault();});
list.addEventListener('keydown',e=>{
  if((e.shiftKey&&e.key==='F10')||e.key==='ContextMenu'){const box=e.target.getBoundingClientRect();if(maybeContext(e.target,box.left+30,box.bottom))e.preventDefault();}
});
menu.addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(b&&state.context)act(state.context.choices[Number(b.dataset.choice)].action);});
menu.addEventListener('keydown',e=>{const buttons=[...menu.querySelectorAll('.menu-button')];const index=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();buttons[(index+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();}else if(e.key==='Enter'||e.key===' '){e.preventDefault();document.activeElement.click();}});
document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target))hideMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!dialog.hidden)closeDialog();else hideMenu();}});
$('#dialog-cancel').addEventListener('click',closeDialog);
dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog();});
$('#dialog-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#dialog-create').click();}});
$('#dialog-create').addEventListener('click',()=>{
  const a=state.action;if(!a)return;const name=$('#dialog-name').value.trim();if(!name){$('#dialog-name').focus();return;}
  if(data.some(row=>refsFor(row).some(ref=>ref.name===name))){toast('引用名称已存在，请重新输入');return;}
  const list=state.created.get(a.row.id)||[];state.created.set(a.row.id,[...list,{type:a.type==='tag'?'tag':'local',name}]);const sha=a.row.id.slice(0,8);closeDialog();render();toast(`预览：已添加 ${name} → ${sha}，未执行 Git`);
});
window.addEventListener('resize',()=>{const scroll=list.scrollTop;render();list.scrollTop=scroll;});
render();
</script>
</body>
</html>
