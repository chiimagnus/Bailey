name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '验证现有版本签名（不重新发布）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bailey-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPMENT_IDENTITY }}
      SIGNING_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Preflight release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit=$(git rev-parse HEAD)
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$commit"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          plutil -convert json -o - Bailey.xcodeproj/project.pbxproj | python3 -c '
          import json, os, sys
          objects = json.load(sys.stdin)["objects"]
          targets = [obj for obj in objects.values()
                     if obj.get("isa") == "PBXNativeTarget" and obj.get("name") == "Bailey"]
          if len(targets) != 1:
              sys.exit("无法确定 Bailey App target")
          configs = objects[targets[0]["buildConfigurationList"]]["buildConfigurations"]
          versions = {objects[c]["name"]: objects[c]["buildSettings"].get("MARKETING_VERSION")
                      for c in configs}
          expected = os.environ["RELEASE_TAG"][1:]
          if versions.get("Debug") != expected or versions.get("Release") != expected:
              sys.exit(f"Tag 版本 {expected} 与 Xcode 项目版本不一致：{versions}")
          '
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | python3 -c '
          import re, sys
          tag = sys.argv[1]
          version = tuple(map(int, tag[1:].split(".")))
          for existing in sys.stdin.read().splitlines():
              if existing == tag or (re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", existing)
                                     and tuple(map(int, existing[1:].split("."))) >= version):
                  sys.exit("拒绝重复或倒退发布：" + existing)
          ' "$RELEASE_TAG"
          fi
      - name: Test tagged source
        run: make test SIGNING=adhoc
      - name: Import Apple Development signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          export SIGNING_KEYCHAIN="$RUNNER_TEMP/bailey-signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          test -n "$CERTIFICATE_P12" && test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY" && test -n "$SIGNING_TEAM"
          umask 077
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/bailey-signing.p12"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$password" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/bailey-signing.p12" -P "$CERTIFICATE_PASSWORD" \
            -k "$SIGNING_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "bailey-signing.p12").unlink()'
      - name: Build and verify release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package VERSION="${RELEASE_TAG#v}" BUILD_NUMBER="$BUILD_NUMBER"
      - name: Publish release archive
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "build/releases/bailey-${RELEASE_TAG#v}-macos-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes --latest
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
          keychain="$RUNNER_TEMP/bailey-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "bailey-signing.p12").unlink(missing_ok=True)'
