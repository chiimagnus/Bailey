name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Xcode tests
        run: >-
          xcodebuild test -project kero.xcodeproj -scheme kero -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData
          -clonedSourcePackagesDirPath build/SourcePackages
          -skipPackageUpdates -disableAutomaticPackageResolution
      - name: Build release app without credentials
        run: bash scripts/build-app.sh release adhoc
      - name: Verify application identity
        run: |
          app='build/DerivedData/Build/Products/Release/Kero.app'
          info="$app/Contents/Info.plist"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = chiimagnus.kero
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")" = Kero
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")" = kero
          codesign --verify --deep --strict "$app"
